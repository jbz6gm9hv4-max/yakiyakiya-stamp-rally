<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#9f1717"><link rel="manifest" href="manifest.json">
<title>やきやきや 12ヶ月鉄板スタンプラリー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17110d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.wrap{max-width:520px;margin:auto;min-height:100vh;background:linear-gradient(#241711,#120d0a)}
.hero{text-align:center;padding:28px 18px 20px;border-bottom:1px solid #60432e}.small{font-size:11px;letter-spacing:.16em;color:#e9c889}
.title{font-family:serif;font-size:26px;margin:7px 0}.sub{font-size:13px;color:#d9c9b8}.count{margin:18px 20px;padding:17px;text-align:center;border:1px solid #8e6a42;border-radius:12px;background:#21150f}
.count b{font-size:42px;color:#f2c14e}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 20px 20px}
.stamp{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #6f5336;background:#251b15;color:#8d8177;text-align:center}
.stamp.done{background:#b51e24;border-color:#f0c45b;color:#fff}.stamp .m{font-size:11px}.stamp .e{font-size:12px;font-weight:700;margin-top:4px}.stamp .check{font-size:18px}
.card{margin:0 20px 18px;padding:18px;border-radius:12px;background:#f4ead7;color:#2b1b12}.card h2{margin:0 0 8px;color:#8d1717;font-family:serif}
.card p{font-size:13px;line-height:1.7}button{width:100%;padding:14px;border:0;border-radius:9px;background:#b51e24;color:#fff;font-weight:700;font-size:15px}
.note{padding:0 20px 30px;color:#a99a8d;font-size:11px;line-height:1.7}
#modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:25px}.modalbox{max-width:420px;width:100%;background:#f4ead7;color:#2b1b12;padding:24px;border-radius:14px;text-align:center}.modalbox h2{color:#8d1717}.big{font-size:40px;color:#b51e24;font-weight:900}
</style></head><body><div class="wrap">
<section class="hero"><div class="small">YAKIYAKIYA UTSUNOMIYA</div><div class="title">12ヶ月 鉄板スタンプラリー</div><div class="sub">毎月ひとつ、やきやきやの思い出を。</div></section>
<div class="count">現在のスタンプ<br><b id="count">0</b> / 12</div><div class="grid" id="grid"></div>
<section class="card"><h2 id="eventTitle">今月のイベント</h2><p id="eventText">ご来店ありがとうございます。</p>
<p><b>スタンプ獲得：</b>店内のQRコードからこのページを開き、「今月のスタンプをGET！」を押してください。</p>
<button id="get">今月のスタンプをGET！</button></section>
<div class="note">※スタンプは1ヶ月につき1個まで。特典の利用条件は店舗の案内に従ってください。<br>※これは試作版です。本番ではデータベース、不正防止、管理画面、特典利用済み管理などを追加します。</div>
</div><div id="modal"><div class="modalbox"><h2>12ヶ月コンプリート！</h2><div class="big">鉄板マスター</div><p>12ヶ月すべてのスタンプを集めました。</p><button onclick="this.closest('#modal').style.display='none'">閉じる</button></div></div>
<script>
const SUPABASE_URL="https://cvggmlpexmpfgwhzsupp.supabase.co";
const SUPABASE_KEY="sb_publishable_8OG-IOXuUTjiHKa1gTjCgg_ha8bUjxH";

const months=[["1月","鉄板初め"],["2月","バレンタイン"],["3月","春の乾杯"],["4月","新生活応援"],["5月","家族で鉄板"],["6月","雨の日割"],["7月","夏の鉄板祭"],["8月","納涼祭"],["9月","日本酒月間"],["10月","ハロウィン"],["11月","食欲の秋"],["12月","年末感謝祭"]];

let supabase;
let stamps=[];

async function start(){
  const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
  document.head.appendChild(s);
  await new Promise(resolve=>s.onload=resolve);

  supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

  let {data:{session}}=await supabase.auth.getSession();

  if(!session){
    const {data,error}=await supabase.auth.signInAnonymously();
    if(error){console.error(error);return;}
    session=data.session;
  }

  const {data,error}=await supabase
    .from("stamps")
    .select("event_id,stamp_events(month_number)")
    .eq("user_id",session.user.id);

  if(error){
    console.error(error);
    return;
  }

  stamps=(data||[]).map(x=>x.stamp_events?.month_number).filter(Boolean);
  render();
}

function render(){
  document.querySelector("#count").textContent=stamps.length;
  document.querySelector("#grid").innerHTML=months.map((m,i)=>`<div class="stamp ${stamps.includes(i+1)?"done":""}"><div class="m">${m[0]}</div><div class="e">${m[1]}</div><div class="check">${stamps.includes(i+1)?"✓":"○"}</div></div>`).join("");
}

document.querySelector("#get").onclick=async()=>{
const code=prompt("店内に掲示されている4桁のコードを入力してください");
if(code!=="8989"){
  alert("コードが違います");
  return;
}
  alert("コード認証OK");
  
  const n=new Date().getMonth()+1;
alert("月="+n+" / stamps="+stamps.join(","));
  if(stamps.includes(n))return;
alert("セッション確認開始");
  const {data:{session}}=await supabase.auth.getSession();
alert("セッション確認完了");
  if(!session){
  alert("セッションがありません");
  return;
}

alert("イベント取得開始");
  const {data:event,error:eventError}=await supabase
    .from("stamp_events")
    .select("id")
    .eq("month_number",n)
    .single();

  if(eventError){
    alert("イベント取得エラー: " + eventError.message);
    return;
  }

  const {error}=await supabase
    .from("stamps")
    .insert({
      user_id:session.user.id,
      event_id:event.id,
      stamped_at:new Date().toISOString()
    });

  if(error){
    alert("スタンプ保存エラー: " + error.message);
    return;
  }

  stamps.push(n);
  render();

  if(stamps.length===12){
    document.querySelector("#modal").style.display="flex";
  }
};

start();
</script></body></html>
